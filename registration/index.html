﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粽夏夜之梦 · 演出报名系统</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Ma+Shan+Zheng&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(180deg, #1a2332 0%, #1e3a5f 30%, #2d4a6f 60%, #1a365d 100%);
            min-height: 100vh;
            color: #e8f4f8;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .night-sky {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .moon {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 35% 35%, #fff9e6 0%, #f4e4c1 40%, #e8d4a8 70%, #d4c08e 100%);
            border-radius: 50%;
            box-shadow:
                0 0 60px rgba(255, 249, 230, 0.6),
                0 0 120px rgba(244, 228, 193, 0.4),
                0 0 180px rgba(232, 212, 168, 0.2),
                inset -15px -10px 30px rgba(212, 192, 142, 0.4);
            animation: moonGlow 4s ease-in-out infinite alternate;
        }

        @keyframes moonGlow {
            0% { box-shadow: 0 0 60px rgba(255, 249, 230, 0.6), 0 0 120px rgba(244, 228, 193, 0.4), inset -15px -10px 30px rgba(212, 192, 142, 0.4); }
            100% { box-shadow: 0 0 80px rgba(255, 249, 230, 0.7), 0 0 150px rgba(244, 228, 193, 0.5), inset -15px -10px 30px rgba(212, 192, 142, 0.4); }
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: starTwinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .firefly {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700, 0 0 20px rgba(255, 215, 0, 0.5);
            animation: fireflyFloat var(--dur) linear infinite;
            animation-delay: var(--delay);
        }

        @keyframes fireflyFloat {
            0% { transform: translate(0, 100vh) scale(0); opacity: 0; }
            10% { opacity: 1; transform: translate(var(--tx), calc(100vh - var(--ty))) scale(1); }
            90% { opacity: 0.8; }
            100% { transform: translate(calc(var(--tx) * 1.5), -20vh) scale(0.5); opacity: 0; }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px 60px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .main-title {
            font-family: 'Ma Shan Zheng', 'Noto Serif SC', serif;
            font-size: clamp(42px, 8vw, 72px);
            font-weight: 900;
            color: #f0e6d3;
            letter-spacing: 12px;
            margin-bottom: 16px;
            text-shadow:
                0 0 20px rgba(240, 230, 211, 0.5),
                0 0 40px rgba(240, 230, 211, 0.3),
                0 4px 12px rgba(0, 0, 0, 0.4);
            animation: titleFloat 3s ease-in-out infinite;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .subtitle {
            font-size: clamp(14px, 2vw, 18px);
            color: rgba(224, 236, 245, 0.85);
            letter-spacing: 8px;
            padding: 12px 32px;
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .card {
            background: linear-gradient(135deg, rgba(26, 51, 93, 0.85) 0%, rgba(45, 74, 111, 0.75) 100%);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 48px;
            border: 1px solid rgba(135, 166, 196, 0.25);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 2px 0 rgba(255, 255, 255, 0.1) inset;
            position: relative;
            overflow: hidden;
            margin-bottom: 32px;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%; right: -30%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(135, 166, 196, 0.12) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            animation: cardGlowA 8s ease-in-out infinite alternate;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -40%; left: -20%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(240, 230, 211, 0.08) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            animation: cardGlowB 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes cardGlowA {
            0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            100% { transform: scale(1.3) rotate(15deg); opacity: 1; }
        }

        @keyframes cardGlowB {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2) rotate(-10deg); opacity: 0.9; }
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .form-title {
            font-family: 'Ma Shan Zheng', serif;
            font-size: 32px;
            color: #f0e6d3;
            margin-bottom: 36px;
            text-align: center;
            letter-spacing: 4px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-label {
            display: block;
            font-size: 15px;
            color: #c5dae8;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 16px 20px;
            background: rgba(13, 27, 48, 0.75);
            border: 1px solid rgba(135, 166, 196, 0.3);
            border-radius: 14px;
            color: #e8f4f8;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            border-color: rgba(135, 166, 196, 0.6);
            background: rgba(13, 27, 48, 0.9);
            box-shadow: 0 0 0 3px rgba(135, 166, 196, 0.15), 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: rgba(197, 218, 232, 0.4);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px 20px;
            background: rgba(13, 27, 48, 0.55);
            border: 1px solid rgba(135, 166, 196, 0.25);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox-group:hover {
            background: rgba(13, 27, 48, 0.75);
            border-color: rgba(135, 166, 196, 0.4);
        }

        .checkbox-input {
            width: 22px;
            height: 22px;
            margin-top: 2px;
            accent-color: #87a6c4;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-label {
            font-size: 15px;
            color: #c5dae8;
            line-height: 1.6;
            cursor: pointer;
        }

        .checkbox-desc {
            font-size: 13px;
            color: rgba(197, 218, 232, 0.6);
            margin-top: 4px;
        }

        .submit-btn {
            width: 100%;
            padding: 18px 40px;
            background: linear-gradient(135deg, #2d4a6f 0%, #3d5a7f 50%, #4a6a8f 100%);
            color: #f0e6d3;
            border: 1px solid rgba(135, 166, 196, 0.4);
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 3px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s ease;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
            border-color: rgba(135, 166, 196, 0.6);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .admin-link {
            text-align: center;
            margin-top: 24px;
        }

        .admin-link a {
            color: rgba(197, 218, 232, 0.5);
            font-size: 13px;
            text-decoration: none;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .admin-link a:hover {
            color: rgba(197, 218, 232, 0.85);
        }

        .admin-link.hidden {
            display: none !important;
        }

        /* 后台管理 */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(135, 166, 196, 0.2);
        }

        .admin-title {
            font-family: 'Ma Shan Zheng', serif;
            font-size: 28px;
            color: #f0e6d3;
            letter-spacing: 3px;
        }

        .logout-btn {
            padding: 10px 24px;
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.4);
            border-radius: 10px;
            color: #f8d7da;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .logout-btn:hover {
            background: rgba(220, 53, 69, 0.25);
            border-color: rgba(220, 53, 69, 0.6);
        }

        .admin-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-danger-all {
            padding: 8px 20px;
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.4);
            border-radius: 8px;
            color: #f8d7da;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-danger-all:hover {
            background: rgba(220, 53, 69, 0.3);
            border-color: rgba(220, 53, 69, 0.6);
        }

        .btn-sm {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid;
            font-family: inherit;
        }

        .btn-edit {
            background: rgba(13, 110, 253, 0.15);
            border-color: rgba(13, 110, 253, 0.4);
            color: #a8cfff;
        }

        .btn-edit:hover {
            background: rgba(13, 110, 253, 0.3);
            border-color: rgba(13, 110, 253, 0.6);
        }

        .btn-del {
            background: rgba(220, 53, 69, 0.15);
            border-color: rgba(220, 53, 69, 0.4);
            color: #f8d7da;
        }

        .btn-del:hover {
            background: rgba(220, 53, 69, 0.3);
            border-color: rgba(220, 53, 69, 0.6);
        }

        .action-cell {
            display: flex;
            gap: 6px;
            white-space: nowrap;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            background: linear-gradient(180deg, #1a2332 0%, #1e3a5f 100%);
            border: 1px solid rgba(135, 166, 196, 0.3);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-family: 'Ma Shan Zheng', serif;
            font-size: 22px;
            color: #f0e6d3;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .modal-field {
            margin-bottom: 14px;
        }

        .modal-field label {
            display: block;
            font-size: 13px;
            color: rgba(197, 218, 232, 0.7);
            margin-bottom: 4px;
        }

        .modal-field input,
        .modal-field textarea {
            width: 100%;
            padding: 8px 12px;
            background: rgba(13, 27, 48, 0.6);
            border: 1px solid rgba(135, 166, 196, 0.3);
            border-radius: 8px;
            color: #e8f4f8;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        .modal-field input:focus,
        .modal-field textarea:focus {
            border-color: rgba(135, 166, 196, 0.6);
        }

        .modal-field textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal-field .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 4px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .modal-btn {
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid;
            font-family: inherit;
        }

        .modal-btn-cancel {
            background: rgba(135, 166, 196, 0.1);
            border-color: rgba(135, 166, 196, 0.3);
            color: #c5dae8;
        }

        .modal-btn-cancel:hover {
            background: rgba(135, 166, 196, 0.2);
        }

        .modal-btn-save {
            background: rgba(40, 167, 69, 0.2);
            border-color: rgba(40, 167, 69, 0.5);
            color: #b8dfc7;
        }

        .modal-btn-save:hover {
            background: rgba(40, 167, 69, 0.35);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: rgba(13, 27, 48, 0.6);
            border: 1px solid rgba(135, 166, 196, 0.2);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 900;
            color: #f0e6d3;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: rgba(197, 218, 232, 0.7);
            letter-spacing: 1px;
        }

        .registrations-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
        }

        .registrations-table th,
        .registrations-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(135, 166, 196, 0.15);
        }

        .registrations-table th {
            background: rgba(13, 27, 48, 0.5);
            color: #c5dae8;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .registrations-table td {
            color: #e8f4f8;
            font-size: 14px;
        }

        .registrations-table tr:hover td {
            background: rgba(135, 166, 196, 0.08);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-yes {
            background: rgba(40, 167, 69, 0.2);
            color: #b8e994;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }

        .badge-no {
            background: rgba(108, 117, 125, 0.2);
            color: #adb5bd;
            border: 1px solid rgba(108, 117, 125, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(197, 218, 232, 0.6);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: rgba(197, 218, 232, 0.7);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #f0e6d3;
        }

        /* 未登录提示 */
        .login-prompt {
            text-align: center;
            padding: 60px 40px;
        }

        .login-prompt-icon {
            font-size: 72px;
            margin-bottom: 24px;
            opacity: 0.6;
        }

        .login-prompt-title {
            font-family: 'Ma Shan Zheng', serif;
            font-size: 28px;
            color: #f0e6d3;
            margin-bottom: 16px;
            letter-spacing: 3px;
        }

        .login-prompt-desc {
            font-size: 15px;
            color: rgba(197, 218, 232, 0.7);
            margin-bottom: 32px;
            line-height: 1.8;
        }

        .login-prompt-btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #2d4a6f 0%, #3d5a7f 50%, #4a6a8f 100%);
            color: #f0e6d3;
            border: 1px solid rgba(135, 166, 196, 0.4);
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            letter-spacing: 2px;
        }

        .login-prompt-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 16px 28px;
            border-radius: 14px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            z-index: 10000;
            animation: toastSlideIn 0.4s ease, toastFadeOut 0.4s ease 2.6s forwards;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
            max-width: 400px;
        }

        .toast-success {
            background: linear-gradient(135deg, #155724, #1e7e34);
            border: 1px solid rgba(40, 167, 69, 0.4);
        }

        .toast-error {
            background: linear-gradient(135deg, #721c24, #a53434);
            border: 1px solid rgba(220, 53, 69, 0.4);
        }

        .toast-warning {
            background: linear-gradient(135deg, #856404, #a88919);
            border: 1px solid rgba(255, 193, 7, 0.4);
        }

        @keyframes toastSlideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes toastFadeOut {
            to { transform: translateX(100%); opacity: 0; }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .container {
                padding: 60px 16px 40px;
            }

            .card {
                padding: 32px 24px;
            }

            .main-title {
                letter-spacing: 6px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .registrations-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <!-- 登录悬浮窗 -->
    <div id="ltyy-float-root"></div>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <div class="night-sky" id="nightSky">
        <div class="moon"></div>
    </div>

    <!-- 前台报名 -->
    <div id="registerPage" class="container">
        <header class="header">
            <h1 class="main-title">粽夏夜之梦</h1>
            <p class="subtitle">演出报名系统</p>
        </header>

        <div class="card">
            <div class="card-content">
                <h2 class="form-title">✨ 演出报名 ✨</h2>

                <form id="registerForm" onsubmit="handleSubmit(event)">
                    <div class="form-group">
                        <label class="form-label">VRC ID *</label>
                        <input type="text" class="form-input" id="vrcId" placeholder="请输入您的VRC ID" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">QQ群内名称 *</label>
                        <input type="text" class="form-input" id="qqName" placeholder="请输入您在QQ群内的昵称" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">演出曲目 *</label>
                        <input type="text" class="form-input" id="songName" placeholder="请输入您要演出的曲目名称" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">歌曲时间</label>
                        <input type="text" class="form-input" id="songDuration" placeholder="例如：3分30秒 或约4分钟">
                    </div>

                    <div class="form-group">
                        <label class="checkbox-group">
                            <input type="checkbox" class="checkbox-input" id="joinVoting">
                            <div class="checkbox-label">
                                参与匿名投票环节

<script>
(function() {
  const SUPABASE_URL = 'https://rhnhuxykupumluhmwvlo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_rCyLOweRttAZ293c25hbGA_H1k4iuU0';

  const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    db: { schema: 'app' }
  });

  // 暴露Supabase客户端供其他脚本使用
  window._supabaseClient = _sb;

  const root = document.getElementById('ltyy-float-root');
  
  let currentUser = null;
  let userProfile = null;
  let modalType = 'login';

  // 暴露全局变量供其他脚本使用
  window.authCurrentUser = currentUser;
  window.authUserProfile = userProfile;
  
  // 同步函数：更新全局变量
  function syncGlobalAuthState() {
    window.authCurrentUser = currentUser;
    window.authUserProfile = userProfile;
    
    // 触发自定义事件通知其他组件
    if (typeof window.CustomEvent === 'function') {
      const event = new CustomEvent('authStateChanged', { 
        detail: { 
          currentUser, 
          userProfile,
          isLoggedIn: !!currentUser 
        } 
      });
      window.dispatchEvent(event);
    }
  }

  async function ensureProfile(user) {
    if (!user) return null;
    
    const { data: existing, error: fetchError } = await _sb
      .from('profiles')
      .select('*')
      .eq('id', user.id)
      .maybeSingle();
    
    if (fetchError) {
      console.error('检查用户资料失败:', fetchError);
      return null;
    }
    
    if (existing) return existing;
    
    const defaultProfile = {
      id: user.id,
      email: user.email,
      username: user.email?.split('@')[0] || '新用户',
      avatar_url: null,
      is_banned: false,
      created_at: new Date().toISOString()
    };
    
    const { data: inserted, error: insertError } = await _sb
      .from('profiles')
      .insert(defaultProfile)
      .select()
      .single();
    
    if (insertError) {
      console.error('创建用户资料失败:', insertError);
      return defaultProfile;
    }
    
    return inserted;
  }

  async function loadProfile() {
    if (!currentUser) {
      userProfile = null;
      syncGlobalAuthState();
      return;
    }
    userProfile = await ensureProfile(currentUser);
    syncGlobalAuthState();  // 同步全局状态
  }

  function renderLoggedOut() {
    root.innerHTML = `<div class="lty-fab" onclick="openModal('login')" title="登录">🎵</div>`;
  }

  function renderLoggedIn() {
    const name = userProfile ? (userProfile.username || '轻音成员') : '加载中...';
    const avatar = userProfile?.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=6b8fd9&color=fff&size=128`;
    
    root.innerHTML = `
      <div class="lty-fab" onclick="toggleMenu()" title="${name}">
        <img src="${avatar}" alt="Avatar">
      </div>
      <div class="lty-menu" id="lty-menu">
        <div class="lty-username">${name}</div>
        <div class="lty-actions">
          <button class="lty-btn-action lty-btn-upload" onclick="openModal('avatarSelect')">
            <span>📷</span> 更换头像
          </button>
          <button class="lty-btn-action lty-btn-edit" onclick="openModal('editProfile')">
            <span>✏️</span> 修改资料
          </button>
          <button class="lty-btn-action lty-btn-logout" onclick="handleLogout()">
            <span>🚪</span> 退出登录
          </button>
        </div>
      </div>
    `;
  }

  window.toggleMenu = () => {
    const menu = document.getElementById('lty-menu');
    if (menu) menu.classList.toggle('active');
  };

  window.closeModal = () => {
    const el = document.getElementById('lty-modal-overlay');
    if (el) {
      el.classList.remove('active');
      setTimeout(() => el.remove(), 300);
    }
  };

  window.openModal = async (type) => {
    modalType = type;
    document.getElementById('lty-menu')?.classList.remove('active');
    
    if ((type === 'editProfile' || type === 'avatarSelect') && !userProfile) {
      await loadProfile();
      if (!userProfile) {
        alert('无法加载用户资料，请刷新页面重试。');
        return;
      }
    }

    const old = document.getElementById('lty-modal-overlay');
    if (old) old.remove();

    let content = '';
    
    if (type === 'login' || type === 'register') {
      const isLogin = type === 'login';
      content = `
        <h3 class="lty-title">${isLogin ? '欢迎回来' : '加入轻音会社'}</h3>
        <input type="email" id="lty-email" class="lty-input" placeholder="邮箱" autocomplete="email">
        <input type="password" id="lty-pass" class="lty-input" placeholder="密码 (≥6位)" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
        <button class="lty-btn-main" onclick="submitAuth()">${isLogin ? '登录' : '注册'}</button>
        <p style="margin-top:15px; font-size:13px; color:rgba(197, 218, 232, 0.7);">
          ${isLogin ? '没账号？' : '有账号？'} 
          <span style="color:#87a6c4; cursor:pointer; font-weight:bold;" onclick="openModal('${isLogin ? 'register' : 'login'}')">${isLogin ? '去注册' : '去登录'}</span>
        </p>
      `;
    } else if (type === 'editProfile') {
      const currentName = userProfile?.username || '';
      content = `
        <h3 class="lty-title">修改资料</h3>
        <label style="display:block; text-align:left; font-size:12px; color:#c5dae8; margin-bottom:5px;">用户名</label>
        <input type="text" id="edit-username" class="lty-input" value="${currentName.replace(/"/g, '&quot;')}" placeholder="输入新用户名">
        <button class="lty-btn-main" onclick="updateUsername()">保存修改</button>
        <button class="lty-btn-secondary" onclick="closeModal()">取消</button>
      `;
    } else if (type === 'avatarSelect') {
      content = `
        <h3 class="lty-title">更换头像</h3>
        <div class="lty-tab-group">
          <div class="lty-tab active" onclick="switchAvatarTab('upload', this)">本地上传</div>
          <div class="lty-tab" onclick="switchAvatarTab('link', this)">外链图片</div>
        </div>
        
        <div id="tab-upload">
          <input type="file" id="file-input" accept="image/*" style="display:none" onchange="uploadAvatarFile(this)">
          <button class="lty-btn-main" onclick="document.getElementById('file-input').click()">选择图片文件</button>
          <p style="font-size:12px; color:rgba(197, 218, 232, 0.6); margin-top:10px;">支持 JPG, PNG, WEBP (最大 1MB)</p>
        </div>

        <div id="tab-link" class="lty-hidden">
          <input type="url" id="link-input" class="lty-input" placeholder="https://example.com/avatar.jpg">
          <button class="lty-btn-main" onclick="updateAvatarLink()">使用外链</button>
        </div>
        
        <button class="lty-btn-secondary" style="margin-top:20px;" onclick="closeModal()">取消</button>
      `;
    }

    const html = `
      <div class="lty-modal-overlay active" id="lty-modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="lty-modal">
          <span class="lty-close" onclick="closeModal()">&times;</span>
          ${content}
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
  };

  window.switchAvatarTab = (tabName, btn) => {
    document.querySelectorAll('.lty-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const uploadTab = document.getElementById('tab-upload');
    const linkTab = document.getElementById('tab-link');
    if (tabName === 'upload') {
      uploadTab.classList.remove('lty-hidden');
      linkTab.classList.add('lty-hidden');
    } else {
      uploadTab.classList.add('lty-hidden');
      linkTab.classList.remove('lty-hidden');
    }
  };

  window.submitAuth = async () => {
    const email = document.getElementById('lty-email').value.trim();
    const pass = document.getElementById('lty-pass').value.trim();
    if (!email || !pass) return alert('请填写完整');

    if (modalType === 'register' && pass.length < 6) {
      return alert('密码长度不能少于6位');
    }
    
    const btn = document.querySelector('.lty-btn-main');
    const oldText = btn.innerText;
    btn.innerText = '...';
    btn.disabled = true;

    try {
      if (modalType === 'register') {
        const { data: existingProfile, error: checkError } = await _sb
          .from('profiles')
          .select('email')
          .eq('email', email)
          .maybeSingle();
        
        if (checkError) throw new Error('检查邮箱失败：' + checkError.message);
        
        if (existingProfile) {
          throw new Error('该邮箱已注册，请直接登录');
        }

        const { error, data } = await _sb.auth.signUp({ email, password: pass });
        if (error) throw new Error('注册失败：' + error.message);
        alert('注册邮件已发送，请查收完成验证。');
        closeModal();
      } else {
        const { error, data } = await _sb.auth.signInWithPassword({ email, password: pass });
        if (error) {
          if (error.message.includes('Invalid login credentials')) {
            throw new Error('邮箱或密码错误');
          } else if (error.message.includes('Email not confirmed')) {
            throw new Error('邮箱未验证，请先验证邮箱');
          } else {
            throw new Error('登录失败：' + error.message);
          }
        }
        
        currentUser = data.user;
        await loadProfile();
        renderLoggedIn();
        closeModal();
      }
    } catch (e) {
      alert(e.message);
    } finally {
      btn.innerText = oldText;
      btn.disabled = false;
    }
  };

  window.handleLogout = async () => {
    if (!confirm('确定退出登录？')) return;
    await _sb.auth.signOut();
    currentUser = null;
    userProfile = null;
    syncGlobalAuthState();  // 同步全局状态
    renderLoggedOut();
  };

  window.updateUsername = async () => {
    if (!userProfile) {
      alert('用户资料未加载，请刷新页面重试。');
      return;
    }

    const newUsername = document.getElementById('edit-username').value.trim();
    if (!newUsername) return alert('用户名不能为空');
    if (newUsername === userProfile.username) {
      alert('用户名未改变');
      closeModal();
      return;
    }

    const btn = document.querySelector('.lty-btn-main');
    btn.innerText = '保存中...';
    btn.disabled = true;

    try {
      const { error } = await _sb
        .from('profiles')
        .update({ username: newUsername })
        .eq('id', currentUser.id);
      
      if (error) {
        if (error.code === '23505') alert('该用户名已被占用，请换一个。');
        else throw error;
      } else {
        userProfile.username = newUsername;
        alert('用户名修改成功！');
        renderLoggedIn();
        closeModal();
      }
    } catch (e) {
      alert('修改失败: ' + e.message);
      console.error(e);
    } finally {
      btn.innerText = '保存修改';
      btn.disabled = false;
    }
  };

  window.uploadAvatarFile = async (input) => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 1024 * 1024) return alert('文件不能超过 1MB');
    await processAvatarUpload(file);
  };

  window.updateAvatarLink = async () => {
    const url = document.getElementById('link-input').value.trim();
    if (!url) return alert('请输入链接');
    if (!url.startsWith('http')) return alert('链接必须以 http 或 https 开头');
    await updateAvatarUrlInDb(url);
  };

  async function processAvatarUpload(file) {
    const btn = document.querySelector('.lty-btn-main');
    if (btn) {
      btn.innerText = '上传中...';
      btn.disabled = true;
    }

    try {
      if (userProfile?.avatar_url && userProfile.avatar_url.includes('/avatars/')) {
        try {
          const urlObj = new URL(userProfile.avatar_url);
          const pathParts = urlObj.pathname.split('/');
          const bucketIndex = pathParts.indexOf('avatars');
          if (bucketIndex !== -1 && pathParts[bucketIndex + 1]) {
            const oldFileName = pathParts.slice(bucketIndex + 1).join('/');
            await _sb.storage.from('avatars').remove([oldFileName]);
          }
        } catch (e) {
          console.warn('删除旧头像失败（可忽略）:', e);
        }
      }

      const ext = file.name.split('.').pop();
      const fileName = `${currentUser.id}_${Date.now()}.${ext}`;
      
      const { error: uploadError } = await _sb.storage
        .from('avatars')
        .upload(fileName, file, { upsert: true });
      
      if (uploadError) {
        console.error('上传错误:', uploadError);
        if (uploadError.message.includes('bucket')) {
          alert('存储桶 "avatars" 未创建，请在 Supabase Storage 中创建公开桶 "avatars"。');
        } else {
          throw uploadError;
        }
        return;
      }

      const { data: { publicUrl } } = _sb.storage.from('avatars').getPublicUrl(fileName);
      await updateAvatarUrlInDb(publicUrl);

    } catch (e) {
      alert('上传失败: ' + e.message);
      console.error(e);
    } finally {
      if (btn) {
        btn.innerText = '选择图片文件';
        btn.disabled = false;
      }
      closeModal();
    }
  }

  async function updateAvatarUrlInDb(url) {
    if (!userProfile) {
      alert('用户资料未加载，无法保存头像。');
      return;
    }

    try {
      const { data, error } = await _sb
        .from('profiles')
        .update({ avatar_url: url })
        .eq('id', currentUser.id)
        .select();

      if (error) {
        console.error('更新数据库失败:', error);
        throw new Error(error.message || '更新数据库失败');
      }

      if (!data || data.length === 0) {
        throw new Error('未找到用户记录，请重试');
      }

      userProfile.avatar_url = url;
      renderLoggedIn();
      alert('头像更新成功！✨');
      closeModal();
    } catch (e) {
      alert('保存失败: ' + e.message);
      console.error(e);
    }
  }

  document.addEventListener('click', (e) => {
    const menu = document.getElementById('lty-menu');
    const fab = document.querySelector('.lty-fab');
    if (menu && !menu.contains(e.target) && (!fab || !fab.contains(e.target))) {
      menu.classList.remove('active');
    }
  });

  (async function init() {
    const { data: { session } } = await _sb.auth.getSession();
    if (session) {
      currentUser = session.user;
      await loadProfile();
      renderLoggedIn();
    } else {
      renderLoggedOut();
    }

    _sb.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session) {
        currentUser = session.user;
        await loadProfile();
        renderLoggedIn();
      } else if (event === 'SIGNED_OUT') {
        currentUser = null;
        userProfile = null;
        renderLoggedOut();
      }
    });
  })();

})();
</script>

    <script>
        // ---------- 共享全局状态（与登录悬浮窗同步）----------
        let currentUser = null;
        let userProfile = null;

        // 使用悬浮窗暴露的Supabase客户端（不再重复创建）
        const db = window._supabaseClient;

        // 同步认证状态函数
        function syncFromAuthFloat() {
            if (typeof window.authCurrentUser !== 'undefined') {
                currentUser = window.authCurrentUser;
            }
            if (typeof window.authUserProfile !== 'undefined') {
                userProfile = window.authUserProfile;
            }
        }

        // 监听悬浮窗的认证状态变化事件
        if (typeof window !== 'undefined') {
            window.addEventListener('authStateChanged', () => {
                syncFromAuthFloat();
                
                if (!document.getElementById('adminPage').classList.contains('hidden')) {
                    if (!(userProfile && userProfile.is_admin === true)) {
                        goBackToRegister();
                    }
                }
            });
        }

        // 初始化星空和萤火虫
        function initNightSky() {
            const sky = document.getElementById('nightSky');
            
            // 创建星星
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 70 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--delay', Math.random() * 3 + 's');
                sky.appendChild(star);
            }

            // 创建萤火虫
            for (let i = 0; i < 20; i++) {
                const firefly = document.createElement('div');
                firefly.className = 'firefly';
                firefly.style.left = Math.random() * 100 + '%';
                firefly.style.setProperty('--dur', (Math.random() * 15 + 10) + 's');
                firefly.style.setProperty('--delay', Math.random() * 10 + 's');
                firefly.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
                firefly.style.setProperty('--ty', (Math.random() * 300 + 100) + 'px');
                sky.appendChild(firefly);
            }
        }

        // 获取浏览器指纹
        function getBrowserFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillText('fingerprint', 2, 2);
            const canvasHash = canvas.toDataURL();
            
            return btoa(navigator.userAgent + canvasHash + screen.width + screen.height).slice(0, 64);
        }

        // 获取已存储的报名数据（从Supabase）
        async function getRegistrations() {
            if (!db) return [];
            const { data, error } = await db
                .from('registrations')
                .select('*')
                .order('created_at', { ascending: true });
            if (error) {
                console.error('读取报名数据失败:', error.message);
                return [];
            }
            return (data || []).map(r => ({
                id: r.id,
                vrcId: r.vrc_id,
                qqName: r.qq_name,
                songName: r.song_name,
                songDuration: r.song_duration,
                joinVoting: r.join_voting,
                notes: r.notes,
                fingerprint: r.fingerprint,
                timestamp: r.created_at,
                timeDisplay: new Date(r.created_at).toLocaleString('zh-CN')
            }));
        }

        // 检查是否已报名（通过尝试insert利用数据库唯一约束判断）
        // 前端不做预查询（RLS可能阻止匿名SELECT），依赖数据库约束防重复
        async function hasRegistered(vrcId) {
            // 不再预查询，直接返回false，由insert时的唯一约束报错来拦截
            return false;
        }

        // Toast 提示
        function showToast(message, type = 'success') {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => toast.remove(), 3000);
        }

        // 处理表单提交
        async function handleSubmit(event) {
            event.preventDefault();

            const vrcId = document.getElementById('vrcId').value.trim();
            const qqName = document.getElementById('qqName').value.trim();
            const songName = document.getElementById('songName').value.trim();
            const songDuration = document.getElementById('songDuration').value.trim();
            const joinVoting = document.getElementById('joinVoting').checked;
            const notes = document.getElementById('notes').value.trim();

            if (!vrcId || !qqName || !songName) {
                showToast('请填写必填项！', 'error');
                return;
            }

            const fingerprint = getBrowserFingerprint();

            const { error } = await db.from('registrations').insert({
                vrc_id: vrcId,
                qq_name: qqName,
                song_name: songName,
                song_duration: songDuration || '未填写',
                join_voting: joinVoting,
                notes: notes || '无',
                fingerprint: fingerprint
            });

            if (error) {
                // 409冲突或唯一约束违反表示已报名
                const isDuplicate = error.status === 409 || 
                    error.code === '23505' || 
                    (error.message && (error.message.includes('unique constraint') || error.message.includes('duplicate')));
                if (isDuplicate) {
                    showToast('您已经报过名了！每个ID只能报名一次。', 'warning');
                } else {
                    console.error('报名失败:', error);
                    showToast('报名失败，请稍后重试', 'error');
                }
                return;
            }

            showToast('报名成功！感谢您的参与 🎉', 'success');
            document.getElementById('registerForm').reset();
        }

        // 页面导航
        function goBackToRegister() {
            event?.preventDefault();
            document.getElementById('registerPage').classList.remove('hidden');
            document.getElementById('adminPage').classList.add('hidden');
        }

        // 检查是否为管理员并显示后台（带详细调试信息）
        async function checkAdminAndShow(e) {
            if (e) e.preventDefault();
            
            syncFromAuthFloat();
            
            if (!currentUser) {
                showToast('请先点击右上角🎵图标登录账号！', 'warning');
                
                if (db) {
                    const { data: { session } } = await db.auth.getSession();
                    
                    if (session) {
                        currentUser = session.user;
                        await loadUserProfile();
                        
                        if (userProfile && userProfile.is_admin === true) {
                            showAdminPage();
                            return;
                        }
                    }
                }
                
                return;
            }

            if (!userProfile) {
                await loadUserProfile();
            }

            if (userProfile && userProfile.is_admin === true) {
                showAdminPage();
            } else {
                const errorMsg = userProfile 
                    ? '权限不足，仅管理员可访问后台'
                    : '无法加载用户资料';
                showToast(errorMsg, 'error');
            }
        }

        async function loadUserProfile() {
            if (!currentUser) return null;

            try {
                const { data, error } = await db
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();

                if (error) throw error;
                
                userProfile = data;
                updateAdminEntry();
                return data;
            } catch (e) {
                console.error('加载用户资料失败:', e.message);
                
                if (e.code === 'PGRST116') {
                    alert('数据库错误: ' + e.message);
                }
                
                return null;
            }
        }

        function updateAdminEntry() {
            const el = document.getElementById('adminEntry');
            if (!el) return;
            if (currentUser && userProfile && userProfile.is_admin === true) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        // 显示后台页面
        function showAdminPage() {
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('adminPage').classList.remove('hidden');
            
            document.getElementById('notLoggedIn').classList.add('hidden');
            document.getElementById('adminContent').classList.remove('hidden');
            
            loadAdminData();
        }

        // 加载后台数据
        async function loadAdminData() {
            const registrations = await getRegistrations();

            // 更新统计
            document.getElementById('totalCount').textContent = registrations.length;
            document.getElementById('votingCount').textContent = registrations.filter(r => r.joinVoting).length;

            const today = new Date().toDateString();
            const todayRegs = registrations.filter(r => new Date(r.timestamp).toDateString() === today);
            document.getElementById('todayCount').textContent = todayRegs.length;

            // 更新表格
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');

            if (registrations.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                document.querySelector('.registrations-table thead').style.display = 'none';
                return;
            }

            emptyState.classList.add('hidden');
            document.querySelector('.registrations-table thead').style.display = '';

            tbody.innerHTML = registrations.map((reg, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${escapeHtml(reg.vrcId)}</strong></td>
                    <td>${escapeHtml(reg.qqName)}</td>
                    <td>${escapeHtml(reg.songName)}</td>
                    <td>${escapeHtml(reg.songDuration)}</td>
                    <td><span class="badge ${reg.joinVoting ? 'badge-yes' : 'badge-no'}">${reg.joinVoting ? '是' : '否'}</span></td>
                    <td>${escapeHtml(reg.notes)}</td>
                    <td style="white-space: nowrap;">${reg.timeDisplay}</td>
                    <td>
                        <div class="action-cell">
                            <button class="btn-sm btn-edit" onclick="openEditModal(${reg.id})">编辑</button>
                            <button class="btn-sm btn-del" onclick="deleteRegistration(${reg.id})">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // HTML转义防止XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function deleteRegistration(id) {
            const registrations = await getRegistrations();
            const target = registrations.find(r => r.id === id);
            if (!target) return;
            if (!confirm(`确定删除 ${target.qqName}（${target.vrcId}）的报名吗？`)) return;
            const { error } = await db.from('registrations').delete().eq('id', id);
            if (error) {
                showToast('删除失败', 'error');
                return;
            }
            loadAdminData();
            showToast('已删除该条报名', 'success');
        }

        async function deleteAllRegistrations() {
            const registrations = await getRegistrations();
            if (registrations.length === 0) {
                showToast('暂无报名数据', 'warning');
                return;
            }
            if (!confirm(`确定清空全部 ${registrations.length} 条报名吗？此操作不可撤销！`)) return;
            const { error } = await db.from('registrations').delete().neq('id', 0);
            if (error) {
                showToast('清空失败', 'error');
                return;
            }
            loadAdminData();
            showToast('已清空所有报名', 'success');
        }

        async function openEditModal(id) {
            const registrations = await getRegistrations();
            const reg = registrations.find(r => r.id === id);
            if (!reg) return;

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'editModal';
            overlay.innerHTML = `
                <div class="modal-box">
                    <div class="modal-title">✏️ 编辑报名信息</div>
                    <div class="modal-field">
                        <label>VRC ID</label>
                        <input type="text" id="edit-vrcId" value="${escapeHtml(reg.vrcId)}">
                    </div>
                    <div class="modal-field">
                        <label>QQ群内名称</label>
                        <input type="text" id="edit-qqName" value="${escapeHtml(reg.qqName)}">
                    </div>
                    <div class="modal-field">
                        <label>演出曲目</label>
                        <input type="text" id="edit-songName" value="${escapeHtml(reg.songName)}">
                    </div>
                    <div class="modal-field">
                        <label>歌曲时长</label>
                        <input type="text" id="edit-songDuration" value="${escapeHtml(reg.songDuration)}">
                    </div>
                    <div class="modal-field">
                        <div class="checkbox-row">
                            <input type="checkbox" id="edit-joinVoting" ${reg.joinVoting ? 'checked' : ''}>
                            <label style="margin:0;color:#e8f4f8;">参与匿名投票环节</label>
                        </div>
                    </div>
                    <div class="modal-field">
                        <label>备注说明</label>
                        <textarea id="edit-notes">${escapeHtml(reg.notes === '无' ? '' : reg.notes)}</textarea>
                    </div>
                    <div class="modal-actions">
                        <button class="modal-btn modal-btn-cancel" onclick="closeEditModal()">取消</button>
                        <button class="modal-btn modal-btn-save" onclick="saveEdit(${id})">保存</button>
                    </div>
                </div>
            `;
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeEditModal();
            });
            document.body.appendChild(overlay);
        }

        function closeEditModal() {
            const modal = document.getElementById('editModal');
            if (modal) modal.remove();
        }

        async function saveEdit(id) {
            const vrcId = document.getElementById('edit-vrcId').value.trim();
            const qqName = document.getElementById('edit-qqName').value.trim();
            const songName = document.getElementById('edit-songName').value.trim();
            const songDuration = document.getElementById('edit-songDuration').value.trim();
            const joinVoting = document.getElementById('edit-joinVoting').checked;
            const notes = document.getElementById('edit-notes').value.trim();

            if (!vrcId || !qqName || !songName) {
                showToast('必填项不能为空', 'error');
                return;
            }

            const { error } = await db.from('registrations').update({
                vrc_id: vrcId,
                qq_name: qqName,
                song_name: songName,
                song_duration: songDuration || '未填写',
                join_voting: joinVoting,
                notes: notes || '无'
            }).eq('id', id);

            if (error) {
                showToast('保存失败', 'error');
                return;
            }

            closeEditModal();
            loadAdminData();
            showToast('修改已保存', 'success');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            initNightSky();

            syncFromAuthFloat();
            
            if (!currentUser && db) {
                const { data: { session }, error: sessionError } = await db.auth.getSession();
                
                if (sessionError) {
                    console.error('获取session失败:', sessionError.message);
                }
                
                if (session) {
                    currentUser = session.user;
                    await loadUserProfile();
                }
            }

            if (db) {
                db.auth.onAuthStateChange(async (event, session) => {
                    if (event === 'SIGNED_IN' && session) {
                        currentUser = session.user;
                        await loadUserProfile();
                        
                        if (!document.getElementById('adminPage').classList.contains('hidden')) {
                            if (!(userProfile && userProfile.is_admin === true)) {
                                goBackToRegister();
                            }
                        }
                    } else if (event === 'SIGNED_OUT') {
                        currentUser = null;
                        userProfile = null;
                        updateAdminEntry();
                        
                        if (!document.getElementById('adminPage').classList.contains('hidden')) {
                            goBackToRegister();
                        }
                    }
                });
            }
        });
    </script>
</body>
